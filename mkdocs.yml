site_name: Custom Fov
site_description: Documentation for the Custom Fov Minecraft mod

theme:
  name: material
  language: en
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.images

extra_css:
  - stylesheets/extra.css

nav:
  - Overview: index.md
  - Installation: install.md
  - Configuration: configuration.md
  - Using the mod: using-the-mod.md
  - Troubleshooting: help.md
  - DevWiki: devwiki.md
